# Optional: requires an ingress controller (e.g. ingress-nginx) installed in
# the cluster. Without it, just `kubectl port-forward svc/frontend 8080:8080`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copilot-ingress
  namespace: nimbus-copilot
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off" # preserve SSE streaming
spec:
  ingressClassName: nginx
  rules:
    - host: nimbus-copilot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
