name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install lightweight test dependencies
        run: pip install -r requirements-test.txt

      - name: Lint
        run: |
          pip install ruff==0.8.4
          ruff check .

      - name: Run tests
        run: pytest -v

  build-images:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nimbus-copilot-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t nimbus-copilot-frontend:ci ./frontend

  validate-k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifests build with kustomize
        uses: azure/setup-kubectl@v4

      - run: kubectl kustomize k8s/ > /dev/null
